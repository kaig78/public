const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEY="lock-key:/public/werkstatt/";  // shared by hub and all studies
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.rounds,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function open_(key){
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct));
  const html=new TextDecoder().decode(buf);
  // while the shell is still parsing, document.open() would append instead of replace
  if(document.readyState==="loading")await new Promise(r=>document.addEventListener("DOMContentLoaded",r,{once:true}));
  document.open();document.write(html);document.close();
}
(async()=>{
  try{
    const saved=JSON.parse(localStorage.getItem(KEY)||"null");
    if(saved&&saved.exp<Date.now())localStorage.removeItem(KEY);
    const raw=saved&&saved.exp>=Date.now()?saved.k:sessionStorage.getItem(KEY);
    if(raw){
      const key=await crypto.subtle.importKey("raw",b64(raw),"AES-GCM",false,["decrypt"]);
      await open_(key);return;
    }
  }catch(e){try{localStorage.removeItem(KEY);sessionStorage.removeItem(KEY)}catch(_){}}
})();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const err=document.getElementById("err");err.textContent="Wird geöffnet…";
  try{
    const key=await derive(document.getElementById("pw").value.trim());
    try{
      const raw=btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw",key))));
      sessionStorage.setItem(KEY,raw);  // this visit: move between pages without retyping
      localStorage.setItem(KEY,JSON.stringify({k:raw,exp:Date.now()+90*864e5}));
    }catch(_){}
    await open_(key);
  }catch(_){err.textContent="Das Passwort stimmt nicht.";}
});
</script>
