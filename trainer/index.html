<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Gesprächstrainer</title>
<link rel="icon" href="https://kaig78.github.io/public/favicon.svg" type="image/svg+xml">
<link rel="icon" href="https://kaig78.github.io/public/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="https://kaig78.github.io/public/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Headway-artiger Lerntrainer: helle Karten, eine Farbe pro Spur, untere Tab-Leiste. */
:root{
  --bg:#f7f5f0; --card:#ffffff; --card2:#f0ede6; --ink:#1c1b22; --ink2:#55535f; --ink3:#8a8794; --line:#e6e2d9;
  --ok:#1f9d6b; --okbg:#e3f5ec; --no:#c9762a; --nobg:#fcefdf;
  --a:#4f7cff; --b:#22b07d; --c:#e8961a; --d:#ef5b5b; --e:#8b5cf6; --f:#0ea5a4;
  --shadow:0 1px 2px rgba(30,25,20,.05),0 6px 20px -8px rgba(30,25,20,.18);
  --display:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
  --ui:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141317; --card:#1e1d23; --card2:#28262e; --ink:#f2f0f6; --ink2:#bcb8c6; --ink3:#8d8999; --line:#302e37;
  --ok:#46c98f; --okbg:#173327; --no:#f0a65a; --nobg:#3a2a18;
  --a:#7d9dff; --b:#4fd09c; --c:#f4b04a; --d:#ff8282; --e:#a98bff; --f:#3cc8c7;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141317; --card:#1e1d23; --card2:#28262e; --ink:#f2f0f6; --ink2:#bcb8c6; --ink3:#8d8999; --line:#302e37;
  --ok:#46c98f; --okbg:#173327; --no:#f0a65a; --nobg:#3a2a18;
  --a:#7d9dff; --b:#4fd09c; --c:#f4b04a; --d:#ff8282; --e:#a98bff; --f:#3cc8c7;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--ui);min-height:100vh;
  padding:0 max(16px,env(safe-area-inset-right)) calc(88px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
body.full{padding-bottom:24px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--a);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
.wrap{max-width:480px;margin:0 auto}

/* Kopf */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 6px}
.top a{text-decoration:none;font-size:14px;color:var(--ink3)}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;color:var(--ink2)}
.pagetitle{font:700 30px/1.1 var(--display);margin:10px 0 18px}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.muted{color:var(--ink2)}
.small{font-size:14px}

/* Karten */
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:18px}
.stack{display:grid;gap:12px}
.hero{color:#fff;background:var(--tc,var(--a));border-radius:24px;padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero h2{font-size:26px;line-height:1.1;margin:6px 0 8px}
.hero .label{color:rgba(255,255,255,.85)}
.hero p{color:rgba(255,255,255,.92)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.14)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font-weight:600;font-size:16px;background:var(--ink);color:var(--bg);min-height:48px;text-decoration:none}
.btn.light{background:#fff;color:#1c1b22}
.btn.ghost{background:var(--card2);color:var(--ink)}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:10px;align-items:center}
.row.wrapr{flex-wrap:wrap}
.spacer{flex:1}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-size:14px;color:var(--ink2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-block;white-space:nowrap;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--tc,var(--a)) 16%,transparent);color:var(--tc,var(--a))}

/* Spuren & Fertigkeiten */
.track{margin-top:22px}
.track h2{font-size:20px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.track h2 i{width:12px;height:12px;border-radius:4px;background:var(--tc);display:inline-block}
.skill{display:flex;align-items:center;gap:12px;text-decoration:none;background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);border-left:4px solid var(--tc)}
.skill h3{font:600 16px/1.3 var(--ui)}
.skill .muted{font-size:13px}
.lv{display:flex;gap:4px;flex:none}
.lv i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.lv i.on{background:var(--tc)}

/* Wochenring */
.ring{display:flex;align-items:center;gap:16px}
.ring svg{flex:none}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:var(--line)}
.ring .fg{stroke:var(--b);stroke-linecap:round;transition:stroke-dashoffset .4s}
.days{display:flex;gap:6px;margin-top:8px}
.days span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--card2);color:var(--ink3)}
.days span.on{background:var(--b);color:#fff}
.days span.today{outline:2px solid var(--ink3);outline-offset:1px}

/* Lektion & Aufgaben (Vollbild) */
.bar{display:flex;gap:4px;margin:6px 0 16px}
.bar i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.bar i.on{background:var(--tc,var(--ink))}
.lesson{min-height:calc(100vh - 160px);display:flex;flex-direction:column}
.lesson .card{flex:1;display:flex;flex-direction:column;gap:14px;padding:22px}
.lesson h2{font-size:24px;line-height:1.15}
.big{font:500 21px/1.4 var(--display)}
.quote{border-left:4px solid var(--tc,var(--a));padding:4px 0 4px 14px;font:500 19px/1.4 var(--display)}
.formel{margin:0;padding:0;list-style:none;counter-reset:f;display:grid;gap:10px}
.formel li{counter-increment:f;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.formel li::before{content:counter(f);width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:700;background:color-mix(in srgb,var(--tc,var(--a)) 16%,transparent);color:var(--tc,var(--a))}
.list{margin:0;padding-left:20px;display:grid;gap:6px}
.flip{border:0;width:100%;text-align:left;border-radius:16px;padding:16px;background:var(--card2);display:grid;gap:8px}
.flip.on{background:var(--okbg)}
.nav{display:flex;gap:10px;margin-top:14px}
.nav .btn{flex:1}

.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:13px 15px;min-height:48px;line-height:1.4}
.opt:hover{border-color:var(--ink3)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--no);background:var(--nobg)}
.opt[disabled]{cursor:default}
.ctx{color:var(--ink2);font-size:16px}
.token{border:0;background:none;padding:3px 2px;border-radius:6px;font:500 20px/1.6 var(--display);color:var(--ink)}
.token.w{border-bottom:2px dotted var(--ink3)}
.token.right{background:var(--okbg);color:var(--ok)}
.token.wrong{background:var(--nobg);color:var(--no)}
.sortitem{border-radius:14px;background:var(--card2);padding:12px 14px;display:grid;gap:8px}
.sortitem .row{flex-wrap:wrap}
.sortitem .chip{padding:6px 12px}
.sortitem .chip.right{background:var(--ok);color:#fff;border-color:var(--ok)}
.sortitem .chip.wrong{background:var(--no);color:#fff;border-color:var(--no)}
.why{font-size:14px;color:var(--ink2)}
.pool,.answer{display:flex;flex-direction:column;gap:8px}
.answer{min-height:60px;border:1.5px dashed var(--line);border-radius:14px;padding:8px}
.part{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;line-height:1.35}
.answer .part{background:var(--card2)}
textarea{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--card);resize:vertical;line-height:1.45}
.muster{background:var(--okbg);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--ok)}
.bubble{background:var(--card2);border-radius:16px 16px 16px 4px;padding:12px 14px;max-width:92%}
.bubble.me{background:color-mix(in srgb,var(--tc,var(--a)) 18%,var(--card));border-radius:16px 16px 4px 16px;margin-left:auto}
.fb{font-size:14px;padding:8px 12px;border-radius:10px}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.no{background:var(--nobg);color:var(--no)}

/* Bottom Sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:18px max(16px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  background:var(--card);box-shadow:0 -8px 30px rgba(0,0,0,.18);border-radius:22px 22px 0 0;transform:translateY(110%);transition:transform .22s ease}
.sheet.on{transform:none}
.sheet .wrap{display:grid;gap:10px}
.sheet h3{font-size:20px}
.sheet.ok h3{color:var(--ok)}
.sheet.no h3{color:var(--no)}

/* Tab-Leiste */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.tabs a{display:grid;justify-items:center;gap:2px;text-decoration:none;font-size:12px;font-weight:600;color:var(--ink3);padding:6px 0}
.tabs a svg{width:24px;height:24px}
.tabs a[aria-current="page"]{color:var(--ink)}
body.full .tabs{display:none}

.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.stat b{display:block;font:700 28px/1 var(--display)}
.stat span{font-size:13px;color:var(--ink2)}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--tc)}
input[type=range]{width:100%;accent-color:var(--tc,var(--a))}
.note{font-size:14px;background:var(--card2);border-radius:14px;padding:12px 14px;color:var(--ink2)}
.center{text-align:center}
.empty{padding:30px 10px;text-align:center;color:var(--ink3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="../">← Alle Seiten</a><button class="iconbtn" id="theme" type="button">Hell/Dunkel</button></div>
  <main id="view" aria-live="polite"><p class="empty">Lädt …</p></main>
</div>
<div class="sheet" id="sheet" role="dialog" aria-modal="false"><div class="wrap"><h3 id="sheetT"></h3><p id="sheetX" class="muted"></p><button class="btn block" id="sheetB" type="button">Weiter</button></div></div>
<nav class="tabs" aria-label="Hauptnavigation"><div class="wrap">
  <a href="#/heute" data-tab="heute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Heute</a>
  <a href="#/fertigkeiten" data-tab="fertigkeiten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Fertigkeiten</a>
  <a href="#/ueben" data-tab="ueben"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Üben</a>
  <a href="#/fortschritt" data-tab="fortschritt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Fortschritt</a>
</div></nav>

<script>
(function(){
"use strict";
/* Adresse des Rollenspiel-Trainers (claude.ai Artifact). Leer = noch nicht gebaut. */
var ROLE_URL = "";

var root=document.documentElement;
function sget(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sset(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var th=sget("kt-theme"); if(th) root.setAttribute("data-theme",th);
document.getElementById("theme").onclick=function(){
  var dark=root.getAttribute("data-theme")==="dark"||(!root.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);
  var n=dark?"light":"dark"; root.setAttribute("data-theme",n); sset("kt-theme",n);
};

/* ---------- Hilfen ---------- */
function el(tag,attrs){var e=document.createElement(tag);if(attrs)for(var k in attrs){var v=attrs[k];if(v==null)continue;
  if(k==="text")e.textContent=v;else if(k==="cls")e.className=v;else if(k==="style")e.setAttribute("style",v);
  else if(k.slice(0,2)==="on")e[k]=v;else e.setAttribute(k,v);}
  function add(c){if(c==null||c===false)return;if(Array.isArray(c)){c.forEach(add);return}e.appendChild(typeof c==="string"?document.createTextNode(c):c)}
  for(var i=2;i<arguments.length;i++)add(arguments[i]);
  return e;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function today(){var d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/864e5)}
function dayLabel(n){var d=new Date(n*864e5);return d.toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"numeric",timeZone:"UTC"})}
var IV=[1,3,7,16,35];
var TRACKCOL={a:"var(--a)",b:"var(--b)",c:"var(--c)",d:"var(--d)",e:"var(--e)",f:"var(--f)"};
var BEREICHE={alle:"Alle Bereiche",partner:"Partnerschaft & Familie",arbeit:"Arbeit & Führung",freunde:"Freunde & Alltag",schwierig:"Schwere Nachrichten"};
var TYPNAME={wahl:"Besser-Wahl",sortieren:"Sortieren",antippen:"Fehler antippen",baukasten:"Baukasten",reaktion:"Reaktion vorhersagen",umschreiben:"Umschreiben",dialog:"Mini-Dialog"};
var ORDER=["spiegeln","gefuehle-benennen","ohr-statt-rat","was-wie-fragen","beobachtung","ich-aussage","bitte","sanfter-einstieg","absicht-wirkung","vier-reiter","widersprechen","entschuldigen",
  "atem-pause","trigger-auszeit","geschichte-pruefen","ziel-klaeren","gespraechsart","nachfragen","feedback-annehmen","klar","feedback-geben","wertschaetzung",
  "beitrag","sicherheit","spitzen","akzeptieren","nein","grenze","schlechte-nachricht","vereinbarung","vorwuerfe","wie-soll-ich","gehalt","grund-wahl-wir"];

/* ---------- Zustand ---------- */
var KEY="kt-v1";
function blank(){return {v:1,sprints:{},box:{},praxis:[],rollen:{},tage:{},ziel:4,bereich:"alle",fuehrung:true,selbst:[],saetze:[]}}
var S=(function(){try{var x=JSON.parse(sget(KEY)||"null");if(x&&x.v===1){var b=blank();for(var k in b)if(!(k in x))x[k]=b[k];return x}}catch(e){}return blank()})();
function save(){sset(KEY,JSON.stringify(S))}
function markDay(){S.tage[today()]=1;save()}

var DATA=null,SK={},TASK={},SC=[];
function skillOf(t){return SK[t.split("-").slice(0,-1).join("-")]}

/* Leitner */
function grade(id,ok){var b=S.box[id]||[0,0];var box=ok?Math.min(5,b[0]+1):1;S.box[id]=[box,today()+IV[box-1]];markDay()}
function due(){var t=today(),out=[];for(var id in S.box){if(TASK[id]&&S.box[id][1]<=t)out.push(id)}
  out.sort(function(a,b){return S.box[a][1]-S.box[b][1]});return out}
function levels(s){var ids=s.aufgaben.map(function(a){return a.id});
  var kennen=!!S.sprints[s.id];
  var good=ids.filter(function(id){return S.box[id]&&S.box[id][0]>=3}).length;
  var koennen=good/ids.length>=0.8;
  var pr=S.praxis.filter(function(p){return p.skill===s.id&&p.ok===true}).length;
  var anwenden=pr>=2&&(S.rollen[s.id]||0)>=1;
  return {kennen:kennen,koennen:koennen,anwenden:anwenden,good:good,total:ids.length,praxis:pr,rollen:S.rollen[s.id]||0}}
function lvDots(s){var l=levels(s);return el("span",{cls:"lv","aria-label":"Stufen: "+(l.kennen?"Kennen ":"")+(l.koennen?"Können ":"")+(l.anwenden?"Anwenden":"")},
  el("i",{cls:l.kennen?"on":""}),el("i",{cls:l.koennen?"on":""}),el("i",{cls:l.anwenden?"on":""}))}
function nextSkill(){for(var i=0;i<ORDER.length;i++){if(SK[ORDER[i]]&&!S.sprints[ORDER[i]])return SK[ORDER[i]]}return null}

/* ---------- Rahmen ---------- */
var view=document.getElementById("view");
function setTab(t){document.querySelectorAll(".tabs a").forEach(function(a){if(a.dataset.tab===t)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")})}
function full(on){document.body.classList.toggle("full",!!on)}
function render(){var h=(location.hash||"#/heute").slice(2).split("/");hideSheet();window.scrollTo(0,0);full(false);
  var r=h[0]||"heute";
  if(r==="heute"){setTab("heute");return renderHeute()}
  if(r==="fertigkeiten"){setTab("fertigkeiten");return renderSkills()}
  if(r==="skill"&&SK[h[1]]){setTab("fertigkeiten");return renderSkill(SK[h[1]])}
  if(r==="lektion"&&SK[h[1]]){return runLesson(SK[h[1]])}
  if(r==="ueben"){setTab("ueben");return renderUeben(h[1])}
  if(r==="fortschritt"){setTab("fortschritt");return renderFortschritt()}
  location.hash="#/heute"}
window.addEventListener("hashchange",render);

/* ---------- Bottom Sheet ---------- */
var sheet=document.getElementById("sheet");
function showSheet(ok,title,text,label,fn){sheet.className="sheet on "+(ok?"ok":"no");document.getElementById("sheetT").textContent=title;
  document.getElementById("sheetX").textContent=text||"";var b=document.getElementById("sheetB");b.textContent=label||"Weiter";
  b.onclick=function(){hideSheet();fn&&fn()};setTimeout(function(){b.focus()},50)}
function hideSheet(){sheet.className="sheet"}

/* ---------- Heute ---------- */
function weekDays(){var t=today();var dow=(new Date().getDay()+6)%7;var start=t-dow;var out=[];for(var i=0;i<7;i++)out.push(start+i);return out}
function renderHeute(){
  var h=new Date().getHours();var gruss=h<11?"Guten Morgen":h<18?"Hallo":"Guten Abend";
  var wd=weekDays(),aktiv=wd.filter(function(d){return S.tage[d]}).length,ziel=S.ziel;
