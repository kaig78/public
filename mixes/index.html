<title>Mixes</title>
<style>
:root{--bg:#f6f2ea;--ink:#1d1b18;--muted:#6f685e;--line:#d9d1c3;--accent:#9a3b2a}
@media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#efe9df;--muted:#a39b8e;--line:#3a352f;--accent:#e08a6d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
  font:16px/1.5 Georgia,"Times New Roman",serif;padding:24px 16px}
form{width:100%;max-width:360px;text-align:center}
h1{font-weight:400;font-size:2.4rem;letter-spacing:-.01em;margin:0 0 .2em}
p{color:var(--muted);margin:0 0 1.6em;font-size:.95rem}
input{width:100%;padding:12px 14px;font:inherit;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{margin-top:12px;width:100%;padding:12px;font:600 .8rem/1 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;
  border:0;border-radius:6px;background:var(--ink);color:var(--bg);cursor:pointer}
label{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:14px;font-size:.85rem;color:var(--muted)}
label input{width:auto}
.err{color:var(--accent);min-height:1.5em;margin:10px 0 0;font-size:.9rem}
</style>
</head>

<form id="f">
  <h1>Mixes</h1>

  <label><input id="rm" type="checkbox"> Remember on this device</label>
  <button type="submit">Open</button>
  <div class="err" id="err" role="alert"></div>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEY="lock-key:"+location.pathname.replace(/[^/]*$/,"");  // one key per folder, so sibling pages share it
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.rounds,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function open_(key){
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct));
  const html=new TextDecoder().decode(buf);
  // while the shell is still parsing, document.open() would append instead of replace
  if(document.readyState==="loading")await new Promise(r=>document.addEventListener("DOMContentLoaded",r,{once:true}));
  document.open();document.write(html);document.close();
}
(async()=>{
  try{
    const raw=localStorage.getItem(KEY)||sessionStorage.getItem(KEY);
    if(raw){
      const key=await crypto.subtle.importKey("raw",b64(raw),"AES-GCM",false,["decrypt"]);
      await open_(key);return;
    }
  }catch(e){try{localStorage.removeItem(KEY);sessionStorage.removeItem(KEY)}catch(_){}}
})();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const err=document.getElementById("err");err.textContent="Opening…";
  try{
    const key=await derive(document.getElementById("pw").value);
    try{
      const raw=btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw",key))));
      sessionStorage.setItem(KEY,raw);  // this visit: move between pages without retyping
      if(document.getElementById("rm").checked)localStorage.setItem(KEY,raw);
    }catch(_){}
    await open_(key);
  }catch(_){err.textContent="That password didn't work.";}
});
</script>
